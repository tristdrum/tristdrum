app = "tristdrum-airbnb-browser-pilot"
primary_region = "jnb"

[build]
  dockerfile = "apps/airbnb-browser/Dockerfile"

[env]
  PORT = "3000"
  TZ = "Africa/Johannesburg"
  AIRBNB_BROWSER_STATE_PATH = "/data/browser-state.enc"

[mounts]
  source = "airbnb_browser_pilot_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
