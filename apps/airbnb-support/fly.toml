app = "tristdrum-airbnb-support"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  AIRBNB_SERVICE_NAME = "airbnb-support"
  AIRBNB_SUPPORT_GMAIL_USER = "tristdrum@gmail.com"
  AIRBNB_SUPPORT_JANE_GMAIL_USER = "janeannechubb@gmail.com"
  AIRBNB_SUPPORT_INITIAL_LOOKBACK_DAYS = "90"
  AIRBNB_SUPPORT_MAX_EMAILS = "500"
  AIRBNB_SUPPORT_LIFECYCLE_MAX_EMAILS = "100"
  AIRBNB_SUPPORT_CANDIDATE_LIMIT = "8"
  AIRBNB_SUPPORT_DECISION_CONCURRENCY = "4"
  AIRBNB_SUPPORT_DELIVERY_LIMIT = "1"
  AIRBNB_SUPPORT_GMAIL_IMPORT_DEADLINE_MS = "45000"
  AIRBNB_SUPPORT_GMAIL_OVERLAP_MINUTES = "360"
  AIRBNB_SUPPORT_GMAIL_ATTEMPTS = "2"
  AIRBNB_SUPPORT_OPENAI_TIMEOUT_MS = "25000"
  AIRBNB_SUPPORT_OPENAI_MODEL = "gpt-5.6-sol"
  AIRBNB_SUPPORT_OPENAI_REASONING_EFFORT = "xhigh"
  AIRBNB_SUPPORT_ALERT_LIMIT = "1"
  AIRBNB_SUPPORT_AUTOMATION_NOT_BEFORE = "2026-08-25T12:45:00Z"
  AIRBNB_SUPPORT_EXTERNAL_WRITES_ENABLED = "true"
  AIRBNB_SUPPORT_LIVE_CONFIRMATION = "ENABLE_AIRBNB_SUPPORT_WRITES"
  AIRBNB_SUPPORT_REPLY_DELIVERY_ENABLED = "true"
  AIRBNB_SUPPORT_AUTONOMOUS_REPLIES_ENABLED = "true"
  AIRBNB_SUPPORT_MANAGEMENT_ALERTS_ENABLED = "true"
  AIRBNB_SUPPORT_TIME_REQUESTS_ENABLED = "true"
  AIRBNB_WHATSAPP_READBACK_ATTEMPTS = "2"
  AIRBNB_WHATSAPP_TIMEOUT_MS = "8000"
  PORT = "3000"
  TZ = "Africa/Johannesburg"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
